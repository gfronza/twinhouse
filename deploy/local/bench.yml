# Resource caps for the ClickHouse comparison (make chbench-up,
# docs/clickhouse-comparison.md), layered over docker-compose.yml.
# Each side gets 4 CPUs: ClickHouse alone, twinhouse split between the
# server and DynamoDB Local. Memory is not split evenly: ClickHouse keeps
# its data on disk, while DynamoDB Local holds every item and stream
# record in memory (300k events need about 2 GiB, 1M about 5 GiB).
# CHBENCH_UNCAPPED=1 leaves this file out.
services:
  clickhouse:
    cpus: 4
    mem_limit: 4g

  chserver-single:
    cpus: 1.5
    mem_limit: 1g

  dynamodb-single:
    cpus: 2.5
    mem_limit: 6g
    environment:
      # Half for the heap: the in-memory database lives outside it.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
